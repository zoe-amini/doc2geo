name: release

# Publishes to PyPI when a v* tag is pushed, and to TestPyPI on demand.
#
# Authentication is PyPI Trusted Publishing (OIDC): no API token is stored anywhere. The
# publisher must be registered on PyPI first — see "Releasing" in the README.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project --with tomli python -c \
            'import tomli;print(tomli.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi
          echo "tag and version agree on $version"

      - name: Install poppler and tesseract
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Test before publishing
        run: |
          uv sync --extra ocr --extra gdal
          uv run ruff check src tests docs
          uv run ruff format --check src tests docs
          uv run pytest -q

      - name: Build
        run: uv build

      - name: Check the metadata renders
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
