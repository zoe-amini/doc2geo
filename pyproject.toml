[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[project]
name = "doc2geo"
version = "0.2.0"
description = "Turn PDFs, scans, Word documents and spreadsheets into GeoJSON, Shapefiles and GeoPackages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Zoe Cayetano" }]
keywords = ["geospatial", "geojson", "shapefile", "ocr", "pdf", "gis", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = [
    "pyproj>=3.6",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Scanned pages. Tesseract itself is a system binary; see the README.
ocr = ["pytesseract>=0.3", "pillow>=10"]
# Shapefile, GeoPackage, FlatGeobuf and friends. GeoJSON and CSV need none of this.
# Geometry is encoded to WKB in-package, so this is pyogrio and numpy — no geopandas, no shapely.
gdal = ["pyogrio>=0.8", "numpy>=1.24"]
all = ["doc2geo[ocr,gdal]"]

[project.urls]
Homepage = "https://github.com/zoe-amini/doc2geo"
Repository = "https://github.com/zoe-amini/doc2geo"
Issues = "https://github.com/zoe-amini/doc2geo/issues"
Changelog = "https://github.com/zoe-amini/doc2geo/releases"

[project.scripts]
doc2geo = "doc2geo.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
